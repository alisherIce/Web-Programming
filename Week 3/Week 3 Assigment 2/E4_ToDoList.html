<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f6f2">
  <title>My To-Do List - Ulmasov Alisher</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20251f;
      --muted: #778078;
      --green: #315b45;
      --green-dark: #254936;
      --paper: #fff;
      --line: #e8ebe5;
      --bg: #f5f6f2;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; padding: 64px 20px;
      background: var(--bg); color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .app { width: min(100%, 590px); margin: 0 auto; }
    .eyebrow { margin: 0 0 12px; color: var(--green); font-size: 12px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(34px, 8vw, 48px); letter-spacing: -.055em; line-height: 1.08; }
    .student { margin: 12px 0 30px; color: var(--muted); font-size: 14px; }
    .panel { overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); box-shadow: 0 16px 42px rgba(31, 42, 32, .06); }
    .add-form { display: flex; gap: 10px; padding: 20px; border-bottom: 1px solid var(--line); }
    .add-form input {
      min-width: 0; flex: 1; height: 48px; padding: 0 15px;
      border: 1px solid #dfe4dc; border-radius: 10px; outline: none;
      background: #fbfcfa; color: var(--ink); font: inherit; font-size: 15px;
      transition: border-color .2s, box-shadow .2s;
    }
    .add-form input::placeholder { color: #a0a8a0; }
    .add-form input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(49, 91, 69, .12); }
    button { font: inherit; cursor: pointer; }
    .add-btn { height: 48px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--green); color: white; font-size: 14px; font-weight: 700; transition: background .2s, transform .2s; }
    .add-btn:hover { transform: translateY(-1px); background: var(--green-dark); }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 20px; border-bottom: 1px solid var(--line); }
    .filters { display: flex; gap: 4px; }
    .filter { padding: 7px 10px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 13px; }
    .filter:hover { background: #f4f6f2; color: var(--ink); }
    .filter.active { background: #edf3ee; color: var(--green-dark); font-weight: 700; }
    .clear-btn { padding: 7px 0 7px 8px; border: 0; background: transparent; color: var(--muted); font-size: 12px; }
    .clear-btn:hover { color: #b0443c; }
    #todo-list { min-height: 70px; margin: 0; padding: 6px 20px; list-style: none; }
    .todo-item { display: flex; align-items: center; gap: 12px; min-height: 54px; border-bottom: 1px solid #f0f1ee; }
    .todo-item:last-child { border-bottom: 0; }
    .check {
      display: grid; width: 21px; height: 21px; flex: 0 0 21px; place-items: center;
      border: 1.5px solid #cbd2c9; border-radius: 50%; background: white; color: white;
      transition: background .18s, border-color .18s;
    }
    .check:hover { border-color: var(--green); }
    .todo-item.completed .check { border-color: var(--green); background: var(--green); }
    .check svg { width: 12px; height: 12px; }
    .task-text { flex: 1; overflow-wrap: anywhere; font-size: 15px; line-height: 1.45; }
    .completed .task-text { color: #a0a8a0; text-decoration: line-through; }
    .delete-btn { width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: #9aa29a; font-size: 19px; line-height: 1; }
    .delete-btn:hover { background: #fff0ee; color: #b0443c; }
    #empty-msg { margin: 0; padding: 31px 20px 35px; color: #929b92; text-align: center; font-size: 14px; }
    .footer { display: flex; justify-content: space-between; gap: 12px; padding: 13px 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    @media (max-width: 480px) {
      body { padding: 42px 14px; }
      .add-form { gap: 8px; padding: 15px; }
      .add-btn { padding: 0 13px; }
      .toolbar { padding: 12px 15px; }
      #todo-list { padding-right: 15px; padding-left: 15px; }
      .footer { padding: 12px 15px; }
      .filter { padding: 7px 8px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="app">
    <p class="eyebrow">A little more organized</p>
    <h1>My To-Do List</h1>
    <p class="student">Ulmasov Alisher · 202537098 · Computer Engineering</p>

    <section class="panel" aria-label="To-do list">
      <form class="add-form" id="add-form">
        <input id="todo-input" type="text" placeholder="What needs to get done?" aria-label="New task" maxlength="160" autocomplete="off">
        <button class="add-btn" type="submit">＋ Add task</button>
      </form>
      <div class="toolbar">
        <nav class="filters" aria-label="Filter tasks">
          <button class="filter active" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter" type="button" data-filter="completed" aria-pressed="false">Done</button>
        </nav>
        <button class="clear-btn" id="clear-btn" type="button">Clear completed</button>
      </div>
      <ul id="todo-list" aria-live="polite"></ul>
      <p id="empty-msg">Nothing here yet. Add your first task above.</p>
      <footer class="footer"><span id="task-count">0 tasks left</span><span>Saved on this device</span></footer>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'alisher-todo-tasks-v1';
    const form = document.querySelector('#add-form');
    const input = document.querySelector('#todo-input');
    const list = document.querySelector('#todo-list');
    const emptyMsg = document.querySelector('#empty-msg');
    const taskCount = document.querySelector('#task-count');
    const clearBtn = document.querySelector('#clear-btn');
    const filters = document.querySelector('.filters');
    let currentFilter = 'all';
    let tasks = loadTasks();

    function loadTasks() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        return Array.isArray(saved) ? saved.filter(task => task && typeof task.text === 'string') : [];
      } catch {
        return [];
      }
    }

    function saveTasks() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch { /* The list still works for this session. */ }
    }

    function render() {
      list.replaceChildren();
      const visibleTasks = tasks.filter(task => currentFilter === 'all' || (currentFilter === 'active' && !task.completed) || (currentFilter === 'completed' && task.completed));

      visibleTasks.forEach(task => {
        const item = document.createElement('li');
        item.className = `todo-item${task.completed ? ' completed' : ''}`;
        item.dataset.id = task.id;

        const check = document.createElement('button');
        check.className = 'check';
        check.type = 'button';
        check.setAttribute('aria-label', task.completed ? 'Mark task active' : 'Mark task complete');
        check.setAttribute('aria-pressed', String(task.completed));
        check.innerHTML = task.completed ? '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m3 8 3.2 3.2L13 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '';

        const text = document.createElement('span');
        text.className = 'task-text';
        text.textContent = task.text;

        const remove = document.createElement('button');
        remove.className = 'delete-btn';
        remove.type = 'button';
        remove.setAttribute('aria-label', `Delete ${task.text}`);
        remove.textContent = '×';

        item.append(check, text, remove);
        list.append(item);
      });

      emptyMsg.hidden = visibleTasks.length > 0;
      emptyMsg.textContent = tasks.length === 0
        ? 'Nothing here yet. Add your first task above.'
        : currentFilter === 'completed' ? 'No completed tasks yet.' : currentFilter === 'active' ? 'You’re all caught up!' : 'No tasks to show.';
      const remaining = tasks.filter(task => !task.completed).length;
      taskCount.textContent = `${remaining} ${remaining === 1 ? 'task' : 'tasks'} left`;
      clearBtn.disabled = !tasks.some(task => task.completed);
      clearBtn.style.opacity = clearBtn.disabled ? '.45' : '1';
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) { input.focus(); return; }
      tasks.push({ id: `${Date.now()}-${Math.random().toString(16).slice(2)}`, text, completed: false });
      saveTasks();
      currentFilter = 'all';
      filters.querySelectorAll('.filter').forEach(button => {
        const active = button.dataset.filter === currentFilter;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', String(active));
      });
      input.value = '';
      render();
      input.focus();
    });

    list.addEventListener('click', event => {
      const item = event.target.closest('.todo-item');
      if (!item) return;
      const task = tasks.find(entry => entry.id === item.dataset.id);
      if (!task) return;
      if (event.target.closest('.check')) task.completed = !task.completed;
      if (event.target.closest('.delete-btn')) tasks = tasks.filter(entry => entry.id !== task.id);
      saveTasks();
      render();
    });

    filters.addEventListener('click', event => {
      const button = event.target.closest('.filter');
      if (!button) return;
      currentFilter = button.dataset.filter;
      filters.querySelectorAll('.filter').forEach(filter => {
        const active = filter === button;
        filter.classList.toggle('active', active);
        filter.setAttribute('aria-pressed', String(active));
      });
      render();
    });

    clearBtn.addEventListener('click', () => {
      tasks = tasks.filter(task => !task.completed);
      saveTasks();
      render();
    });

    render();
  </script>
</body>
</html>
