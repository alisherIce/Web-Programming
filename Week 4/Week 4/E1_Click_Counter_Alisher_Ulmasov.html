<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 4 E1 — Click Counter | Alisher Ulmasov</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f6fa;color:#202b3c}.card{width:min(100%,480px);padding:32px;text-align:center;background:white;border:1px solid #d9e1ed;border-radius:18px;box-shadow:0 12px 32px #17255412}.student{color:#64748b}.count{font-size:64px;font-weight:800;margin:22px 0;color:#1d4ed8}button{border:0;border-radius:10px;padding:13px 20px;font-size:16px;font-weight:700;background:#1d4ed8;color:white;cursor:pointer}.done{background:#16a34a!important}#message{min-height:28px;font-weight:700;color:#15803d}a{display:inline-block;margin-top:22px;color:#1d4ed8}
</style>
</head>
<body>
<main class="card">
<h1>E1 — Click Counter</h1>
<p class="student">Alisher Ulmasov | Gachon University</p>
<p>Click the button five times. At five clicks, it turns green and shows a congratulations message.</p>
<div id="count" class="count" aria-live="polite">0</div>
<button id="clicker" type="button">Click me!</button>
<p id="message" role="status" aria-live="polite"></p>
<a href="../index.html">← Back to Week 4 assignments</a>
</main>
<script>
let count = 0;
const countDisplay = document.querySelector('#count');
const button = document.querySelector('#clicker');
const message = document.querySelector('#message');

button.addEventListener('click', () => {
  count++;
  countDisplay.textContent = count;
  if (count >= 5) {
    button.classList.add('done');
    message.textContent = '🎉 Congratulations! You reached 5 clicks!';
  }
});
</script>
</body>
</html>
