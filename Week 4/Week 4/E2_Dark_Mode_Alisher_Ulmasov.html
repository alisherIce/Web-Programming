<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 4 E2 — Dark Mode Card | Alisher Ulmasov</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#eef2f7;color:#1f2937;transition:background .2s}.card{width:min(100%,380px);padding:32px;border:2px solid #d5deeb;border-radius:18px;background:white;text-align:center;box-shadow:0 12px 32px #17255414;transition:background .2s,color .2s,border-color .2s}.card.dark{background:#172033;color:#f1f5f9;border-color:#46536b}.avatar{width:82px;height:82px;display:grid;place-items:center;margin:0 auto 16px;border-radius:50%;background:#dbeafe;color:#1d4ed8;font-size:32px;font-weight:800}.card.dark .avatar{background:#334155;color:#bfdbfe}.muted{color:#64748b}.card.dark .muted{color:#cbd5e1}button{padding:12px 18px;border:0;border-radius:10px;background:#1d4ed8;color:white;font-weight:700;font-size:15px;cursor:pointer}a{display:inline-block;margin-top:24px;color:#1d4ed8}
</style>
</head>
<body>
<main id="card" class="card">
<div class="avatar" aria-hidden="true">AU</div>
<h1>Alisher Ulmasov</h1>
<p class="muted">Computer Engineering Student</p>
<p>Gachon University · Web Programming</p>
<button id="toggle-btn" type="button">🌙 Dark Mode</button>
<p><a href="../index.html">← Back to Week 4 assignments</a></p>
</main>
<script>
const card = document.querySelector('#card');
const button = document.querySelector('#toggle-btn');

button.addEventListener('click', () => {
  card.classList.toggle('dark');
  if (card.classList.contains('dark')) {
    button.textContent = '☀️ Light Mode';
  } else {
    button.textContent = '🌙 Dark Mode';
  }
});
</script>
</body>
</html>
