<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E2 - Dark Mode Toggle - Alisher Ulmasov</title>
  <style>
    *{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f5;color:#222;transition:.25s}
    .card{padding:30px;border-radius:16px;width:min(100%,360px);background:#fff;border:2px solid #dbe3ef;text-align:center;box-shadow:0 8px 28px #17255418;transition:.25s}
    button{padding:12px 18px;border:0;border-radius:10px;background:#1a56db;color:white;font-size:16px;cursor:pointer}
    body.dark{background:#101827;color:#f1f5f9}.dark .card{background:#1e293b;border-color:#475569;color:#f1f5f9}
    a{display:inline-block;margin-top:22px;color:#1a56db}.dark a{color:#93c5fd}
  </style>
</head>
<body>
  <main class="card">
    <h1>E2 — Dark Mode</h1>
    <p>Student: Alisher Ulmasov</p>
    <p>Use the button to switch the page between light and dark themes.</p>
    <button id="themeToggle" type="button">🌙 Enable Dark Mode</button>
    <p><a href="../index.html">Back to Week 4</a></p>
  </main>
  <script>
    const toggle = document.querySelector("#themeToggle");
    toggle.addEventListener("click", () => {
      const dark = document.body.classList.toggle("dark");
      toggle.textContent = dark ? "☀️ Enable Light Mode" : "🌙 Enable Dark Mode";
    });
  </script>
</body>
</html>
