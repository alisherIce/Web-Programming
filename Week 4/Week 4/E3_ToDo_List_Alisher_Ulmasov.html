<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E3 - To-Do List - Alisher Ulmasov</title>
  <style>
    body{font-family:Arial,sans-serif;padding:30px;max-width:560px;margin:auto;color:#222;background:#f8fafc}
    h1{color:#1a56db}.student{color:#666;margin-bottom:24px}.add-row{display:flex;gap:8px;margin-bottom:16px}
    input{flex:1;min-width:0;padding:11px 12px;border:2px solid #cbd5e1;border-radius:8px;font-size:16px}
    button{padding:10px 16px;border:0;border-radius:8px;background:#1a56db;color:white;cursor:pointer;font-size:15px}
    ul{padding:0;list-style:none}li{display:flex;align-items:center;gap:10px;padding:12px;margin:8px 0;background:white;border:1px solid #e2e8f0;border-radius:8px}
    li span{flex:1;overflow-wrap:anywhere}.done span{text-decoration:line-through;color:#64748b}.remove{background:#dc2626}
    a{color:#1a56db}
  </style>
</head>
<body>
  <h1>E3 — Interactive To-Do List</h1>
  <p class="student">Student: Alisher Ulmasov | Gachon University</p>
  <p>Add tasks, mark them complete, or remove them from your list.</p>
  <form class="add-row" id="taskForm">
    <input id="taskInput" type="text" placeholder="Enter a task..." aria-label="New task" required>
    <button type="submit">Add task</button>
  </form>
  <ul id="taskList"></ul>
  <p><a href="../index.html">Back to Week 4</a></p>
  <script>
    const form = document.querySelector("#taskForm");
    const input = document.querySelector("#taskInput");
    const list = document.querySelector("#taskList");
    form.addEventListener("submit", event => {
      event.preventDefault();
      const task = input.value.trim();
      if (!task) return;
      const li = document.createElement("li");
      const check = document.createElement("input");
      check.type = "checkbox";
      check.setAttribute("aria-label", "Mark task complete");
      const text = document.createElement("span");
      text.textContent = task;
      const remove = document.createElement("button");
      remove.textContent = "Remove";
      remove.className = "remove";
      remove.type = "button";
      check.addEventListener("change", () => li.classList.toggle("done", check.checked));
      remove.addEventListener("click", () => li.remove());
      li.append(check, text, remove);
      list.appendChild(li);
      input.value = "";
      input.focus();
    });
  </script>
</body>
</html>
