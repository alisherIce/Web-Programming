<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 4 E3 — To-Do List | Alisher Ulmasov</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;padding:28px;max-width:600px;margin:auto;color:#243047;background:#f5f7fb}h1{color:#1d4ed8}.student{color:#64748b}.add-row{display:flex;gap:8px;margin:22px 0}input{flex:1;min-width:0;padding:12px;border:2px solid #cbd5e1;border-radius:9px;font-size:16px}button{padding:11px 16px;border:0;border-radius:9px;background:#1d4ed8;color:white;font-weight:700;cursor:pointer}ul{list-style:none;padding:0}.todo-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;margin:8px 0;background:white;border:1px solid #dbe2ec;border-radius:9px}.todo-item span{overflow-wrap:anywhere}.del-btn{background:#dc2626;padding:6px 10px}#empty-msg{padding:18px;text-align:center;color:#64748b}a{color:#1d4ed8}
</style>
</head>
<body>
<main>
<h1>E3 — Interactive To-Do List</h1>
<p class="student">Alisher Ulmasov | Gachon University</p>
<p>Add tasks by clicking Add or pressing Enter. Use ✕ to remove a task.</p>
<div class="add-row"><input id="todo-input" type="text" placeholder="Add a task..." aria-label="New task"><button id="add-btn" type="button">+ Add</button></div>
<ul id="todo-list" aria-label="Tasks"></ul>
<p id="empty-msg">No tasks yet! Add one above.</p>
<p><a href="../index.html">← Back to Week 4 assignments</a></p>
</main>
<script>
const input = document.querySelector('#todo-input');
const addBtn = document.querySelector('#add-btn');
const list = document.querySelector('#todo-list');
const emptyMsg = document.querySelector('#empty-msg');

function updateEmpty() {
  emptyMsg.hidden = list.children.length !== 0;
}

function addTask() {
  const text = input.value.trim();
  if (!text) return;

  const li = document.createElement('li');
  li.className = 'todo-item';
  const label = document.createElement('span');
  label.textContent = text;
  const deleteButton = document.createElement('button');
  deleteButton.type = 'button';
  deleteButton.className = 'del-btn';
  deleteButton.textContent = '✕';
  deleteButton.setAttribute('aria-label', 'Delete ' + text);
  li.append(label, deleteButton);
  list.appendChild(li);
  input.value = '';
  input.focus();
  updateEmpty();
}

addBtn.addEventListener('click', addTask);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addTask();
});
list.addEventListener('click', (e) => {
  if (e.target.classList.contains('del-btn')) {
    e.target.closest('li').remove();
    updateEmpty();
  }
});
updateEmpty();
</script>
</body>
</html>
