<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSONPlaceholder Posts | Week 6</title><link rel="stylesheet" href="../portfolio.css">
<style>
main{width:min(900px,100%);margin:auto;padding:2rem clamp(1rem,4vw,2rem);flex:1}.panel{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:1.25rem}.actions{display:flex;gap:.7rem;flex-wrap:wrap}button{border:0;border-radius:8px;padding:.75rem 1rem;background:var(--blue);color:white;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#status{color:var(--muted)}#posts{display:grid;gap:.8rem;margin-top:1rem}.post{padding:1rem;border:1px solid var(--line);border-radius:10px}.post h3{margin:.2rem 0}.post p{margin:.5rem 0 0;color:var(--muted)}.back{display:inline-block;margin-top:1.5rem}
</style></head>
<body>
<nav class="site-nav"><a class="wordmark" href="../index.html">ALISHER ULMASOV<span> / WEEK 06</span></a><a class="nav-link" href="index.html">← Week 6</a></nav>
<main><header class="archive-intro"><div class="archive-meta"><span>06.02 · FETCH API</span><span>JSONPLACEHOLDER</span></div><h1>Posts Explorer.</h1><p>Fetch sample posts from a public API and render the results dynamically.</p></header>
<section class="panel"><div class="actions"><button id="load" type="button">Load 10 posts</button><button id="clear" type="button">Clear results</button></div><p id="status" role="status" aria-live="polite">Select “Load 10 posts” to start.</p><div id="posts"></div></section><a class="back" href="index.html">← Back to Week 6</a></main>
<footer class="site-footer">© 2026<br>Alisher Ulmasov | Gachon University</footer>
<script>
const loadButton=document.querySelector('#load'),clearButton=document.querySelector('#clear'),status=document.querySelector('#status'),posts=document.querySelector('#posts');
loadButton.addEventListener('click',async()=>{loadButton.disabled=true;status.textContent='Loading posts…';posts.replaceChildren();try{const response=await fetch('https://jsonplaceholder.typicode.com/posts?_limit=10');if(!response.ok)throw new Error('Request failed');const data=await response.json();data.forEach(post=>{const card=document.createElement('article');card.className='post';const title=document.createElement('h3');title.textContent=post.id+'. '+post.title;const body=document.createElement('p');body.textContent=post.body;card.append(title,body);posts.append(card)});status.textContent='Loaded '+data.length+' posts successfully.'}catch(error){status.textContent='Could not load posts. Check your connection and try again.'}finally{loadButton.disabled=false}});
clearButton.addEventListener('click',()=>{posts.replaceChildren();status.textContent='Results cleared.'});
</script></body></html>
