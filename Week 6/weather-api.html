<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Weather Lookup | Week 6</title><link rel="stylesheet" href="../portfolio.css">
<style>main{width:min(800px,100%);margin:auto;padding:2rem clamp(1rem,4vw,2rem);flex:1}.panel{padding:1.3rem;background:var(--white);border:1px solid var(--line);border-radius:14px}.controls{display:flex;gap:.6rem;flex-wrap:wrap}input,button{padding:.8rem 1rem;border-radius:8px;font:inherit}input{flex:1;min-width:180px;border:1px solid var(--line);background:var(--white);color:var(--ink)}button{border:0;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.6}#status{color:var(--muted)}.weather{margin-top:1rem;padding:1rem;border-radius:10px;background:var(--paper)}.back{display:inline-block;margin-top:1.5rem}</style></head>
<body><nav class="site-nav"><a class="wordmark" href="../index.html">ALISHER ULMASOV<span> / WEEK 06</span></a><a class="nav-link" href="index.html">← Week 6</a></nav>
<main><header class="archive-intro"><div class="archive-meta"><span>06.03 · FETCH API</span><span>OPEN-METEO</span></div><h1>Weather Lookup.</h1><p>Search a city and request current weather using geocoding and forecast APIs.</p></header><section class="panel"><form id="form" class="controls"><input id="city" value="Seoul" aria-label="City name" placeholder="Enter a city" required><button id="search" type="submit">Get weather</button></form><p id="status" role="status" aria-live="polite">Enter a city to check the weather.</p><div id="weather"></div></section><a class="back" href="index.html">← Back to Week 6</a></main><footer class="site-footer">© 2026<br>Alisher Ulmasov | Gachon University</footer>
<script>
const form=document.querySelector('#form'),cityInput=document.querySelector('#city'),button=document.querySelector('#search'),status=document.querySelector('#status'),output=document.querySelector('#weather');
form.addEventListener('submit',async event=>{event.preventDefault();const city=cityInput.value.trim();if(!city)return;button.disabled=true;status.textContent='Finding city and loading weather…';output.replaceChildren();try{const geoResponse=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1&language=en&format=json');if(!geoResponse.ok)throw new Error();const geo=await geoResponse.json();if(!geo.results?.length){status.textContent='City not found. Try another name.';return}const place=geo.results[0];const weatherResponse=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+place.latitude+'&longitude='+place.longitude+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m');if(!weatherResponse.ok)throw new Error();const data=await weatherResponse.json(),current=data.current;const card=document.createElement('section');card.className='weather';const heading=document.createElement('h2');heading.textContent=place.name+(place.country?', '+place.country:'');const details=document.createElement('p');details.textContent='Temperature: '+current.temperature_2m+' '+data.current_units.temperature_2m+' · Feels like: '+current.apparent_temperature+' '+data.current_units.apparent_temperature+' · Humidity: '+current.relative_humidity_2m+'% · Wind: '+current.wind_speed_10m+' '+data.current_units.wind_speed_10m;card.append(heading,details);output.append(card);status.textContent='Current weather loaded.'}catch(error){status.textContent='Weather data could not be loaded. Please try again.'}finally{button.disabled=false}});
</script></body></html>
