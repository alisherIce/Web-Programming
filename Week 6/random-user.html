<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Random User | Week 6</title><link rel="stylesheet" href="../portfolio.css"><style>main{width:min(750px,100%);margin:auto;padding:2rem clamp(1rem,4vw,2rem);flex:1}.panel{padding:1.5rem;text-align:center;background:var(--white);border:1px solid var(--line);border-radius:14px}button{padding:.8rem 1rem;border:0;border-radius:8px;background:var(--blue);color:white;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6}#profile{margin-top:1.2rem}#profile img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid var(--line)}#profile p{color:var(--muted)}#status{color:var(--muted)}.back{display:inline-block;margin-top:1.5rem}</style></head>
<body><nav class="site-nav"><a class="wordmark" href="../index.html">ALISHER ULMASOV<span> / WEEK 06</span></a><a class="nav-link" href="index.html">← Week 6</a></nav>
<main><header class="archive-intro"><div class="archive-meta"><span>06.04 · FETCH API</span><span>RANDOMUSER.ME</span></div><h1>Random User Generator.</h1><p>Request a random profile and render user details from JSON.</p></header><section class="panel"><button id="generate" type="button">Generate a user</button><p id="status" role="status" aria-live="polite">Click to load a random profile.</p><div id="profile"></div></section><a class="back" href="index.html">← Back to Week 6</a></main><footer class="site-footer">© 2026<br>Alisher Ulmasov | Gachon University</footer>
<script>
const button=document.querySelector('#generate'),status=document.querySelector('#status'),profile=document.querySelector('#profile');
button.addEventListener('click',async()=>{button.disabled=true;status.textContent='Loading profile…';profile.replaceChildren();try{const response=await fetch('https://randomuser.me/api/');if(!response.ok)throw new Error();const result=await response.json(),user=result.results?.[0];if(!user)throw new Error();const img=document.createElement('img');img.src=user.picture.large;img.alt='Profile portrait';const name=document.createElement('h2');name.textContent=user.name.first+' '+user.name.last;const email=document.createElement('p');email.textContent=user.email;const location=document.createElement('p');location.textContent=user.location.city+', '+user.location.country;const phone=document.createElement('p');phone.textContent='Phone: '+user.phone;profile.append(img,name,email,location,phone);status.textContent='Random profile loaded.'}catch(error){status.textContent='Could not load a profile. Try again.'}finally{button.disabled=false}});
</script></body></html>
