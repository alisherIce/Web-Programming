<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pokémon Search | Week 6</title><link rel="stylesheet" href="../portfolio.css"><style>main{width:min(750px,100%);margin:auto;padding:2rem clamp(1rem,4vw,2rem);flex:1}.panel{padding:1.3rem;background:var(--white);border:1px solid var(--line);border-radius:14px}.controls{display:flex;gap:.6rem}.controls input{flex:1;min-width:0;padding:.8rem;border:1px solid var(--line);border-radius:8px;background:var(--white);color:var(--ink);font:inherit}.controls button{padding:.8rem 1rem;border:0;border-radius:8px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer}#pokemon{text-align:center;margin-top:1rem}#pokemon img{width:180px;max-width:100%;image-rendering:pixelated}#status{color:var(--muted)}.back{display:inline-block;margin-top:1.5rem}</style></head>
<body><nav class="site-nav"><a class="wordmark" href="../index.html">ALISHER ULMASOV<span> / WEEK 06</span></a><a class="nav-link" href="index.html">← Week 6</a></nav>
<main><header class="archive-intro"><div class="archive-meta"><span>06.05 · FETCH API</span><span>POKÉAPI</span></div><h1>Pokémon Search.</h1><p>Look up a Pokémon by name or Pokédex number and inspect its types and stats.</p></header><section class="panel"><form id="form" class="controls"><input id="query" value="pikachu" aria-label="Pokémon name or number" placeholder="e.g. pikachu or 25" required><button type="submit">Search</button></form><p id="status" role="status" aria-live="polite">Search for a Pokémon to begin.</p><div id="pokemon"></div></section><a class="back" href="index.html">← Back to Week 6</a></main><footer class="site-footer">© 2026<br>Alisher Ulmasov | Gachon University</footer>
<script>
const form=document.querySelector('#form'),queryInput=document.querySelector('#query'),status=document.querySelector('#status'),output=document.querySelector('#pokemon');form.addEventListener('submit',async event=>{event.preventDefault();const query=queryInput.value.trim().toLowerCase();if(!query)return;status.textContent='Searching…';output.replaceChildren();try{const response=await fetch('https://pokeapi.co/api/v2/pokemon/'+encodeURIComponent(query));if(!response.ok){if(response.status===404){status.textContent='Pokémon not found. Check the spelling or number.';return}throw new Error()}const p=await response.json();const img=document.createElement('img');img.src=p.sprites.other?.['official-artwork']?.front_default||p.sprites.front_default||'';img.alt=p.name;const title=document.createElement('h2');title.textContent='#'+p.id+' '+p.name[0].toUpperCase()+p.name.slice(1);const types=document.createElement('p');types.textContent='Type: '+p.types.map(item=>item.type.name).join(', ');const stats=document.createElement('p');stats.textContent=p.stats.map(item=>item.stat.name+': '+item.base_stat).join(' · ');output.append(img,title,types,stats);status.textContent='Pokémon data loaded.'}catch(error){status.textContent='Could not connect to PokéAPI. Try again.'}});
</script></body></html>
