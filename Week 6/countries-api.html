<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Country Explorer | Week 6</title><link rel="stylesheet" href="../portfolio.css"><style>main{width:min(800px,100%);margin:auto;padding:2rem clamp(1rem,4vw,2rem);flex:1}.panel{padding:1.3rem;background:var(--white);border:1px solid var(--line);border-radius:14px}.controls{display:flex;gap:.6rem}.controls input{flex:1;min-width:0;padding:.8rem;border:1px solid var(--line);border-radius:8px;background:var(--white);color:var(--ink);font:inherit}.controls button{padding:.8rem 1rem;border:0;border-radius:8px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer}#country{margin-top:1rem}#country img{width:160px;max-width:100%;border:1px solid var(--line)}#status{color:var(--muted)}.back{display:inline-block;margin-top:1.5rem}</style></head>
<body><nav class="site-nav"><a class="wordmark" href="../index.html">ALISHER ULMASOV<span> / WEEK 06</span></a><a class="nav-link" href="index.html">← Week 6</a></nav>
<main><header class="archive-intro"><div class="archive-meta"><span>06.06 · FETCH API</span><span>REST COUNTRIES</span></div><h1>Country Explorer.</h1><p>Search for a country and display its flag, region, capital, population, and languages.</p></header><section class="panel"><form id="form" class="controls"><input id="country-name" value="South Korea" aria-label="Country name" placeholder="Enter a country" required><button type="submit">Find country</button></form><p id="status" role="status" aria-live="polite">Enter a country name to begin.</p><div id="country"></div></section><a class="back" href="index.html">← Back to Week 6</a></main><footer class="site-footer">© 2026<br>Alisher Ulmasov | Gachon University</footer>
<script>
const form=document.querySelector('#form'),input=document.querySelector('#country-name'),status=document.querySelector('#status'),output=document.querySelector('#country');form.addEventListener('submit',async event=>{event.preventDefault();const name=input.value.trim();if(!name)return;status.textContent='Looking up country…';output.replaceChildren();try{const response=await fetch('https://restcountries.com/v3.1/name/'+encodeURIComponent(name)+'?fields=name,flags,capital,region,subregion,population,languages,currencies');if(!response.ok){if(response.status===404){status.textContent='No country found. Try another name.';return}throw new Error()}const data=await response.json(),c=data[0];const flag=document.createElement('img');flag.src=c.flags.svg||c.flags.png;flag.alt=c.flags.alt||'Flag of '+c.name.common;const title=document.createElement('h2');title.textContent=c.name.common;const details=document.createElement('p');const languages=c.languages?Object.values(c.languages).join(', '):'Not listed';const capital=c.capital?.join(', ')||'Not listed';details.textContent='Capital: '+capital+' · Region: '+c.region+' · Population: '+Number(c.population).toLocaleString()+' · Languages: '+languages;output.append(flag,title,details);status.textContent='Country details loaded.'}catch(error){status.textContent='Could not load country information. Please try again.'}});
</script></body></html>
